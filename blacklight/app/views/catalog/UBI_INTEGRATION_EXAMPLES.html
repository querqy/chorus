<!-- 
  UBI Integration Example for Product Links
  
  Add this JavaScript snippet to track product clicks in your search results.
  Place this in your document partial or wherever you display product links.
-->

<script>
  // Example: Track product clicks in search results
  document.addEventListener('DOMContentLoaded', function() {
    // Find all product links (adjust selector to match your HTML structure)
    const productLinks = document.querySelectorAll('.document a[href*="/catalog/"]');
    
    productLinks.forEach(function(link, index) {
      link.addEventListener('click', function(e) {
        if (typeof window.UbiTracking !== 'undefined') {
          // Extract product information from the link's parent element
          const productElement = link.closest('.document');
          
          // Build product object (adjust based on your data structure)
          const product = {
            id: productElement.dataset.documentId || productElement.id,
            title: productElement.querySelector('.document-title-heading')?.textContent?.trim(),
            url: link.href
          };
          
          // Track the click event with position
          window.UbiTracking.trackProductClick(product, index);
        }
      });
    });
  });
</script>
